version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roughapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-roughapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roughapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: us-central1-docker.pkg.dev/project-c4d8eb44-8804-464e-abf/roughapp/api:latest
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roughapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-roughapp}
      SECRET_KEY: ${SECRET_KEY}
      GUEST_CLEANUP_INTERVAL_MINUTES: ${GUEST_CLEANUP_INTERVAL_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
      - tree_artifacts:/app/data/tree_artifacts
    restart: unless-stopped

  frontend:
    image: us-central1-docker.pkg.dev/project-c4d8eb44-8804-464e-abf/roughapp/frontend:latest
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  tree_artifacts:
  caddy_data:
  caddy_config:

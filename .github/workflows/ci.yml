name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1066329100991/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-c4d8eb44-8804-464e-abf.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          docker compose build
          docker tag roughapp-api us-central1-docker.pkg.dev/project-c4d8eb44-8804-464e-abf/roughapp/api:latest
          docker tag roughapp-frontend us-central1-docker.pkg.dev/project-c4d8eb44-8804-464e-abf/roughapp/frontend:latest
          docker push us-central1-docker.pkg.dev/project-c4d8eb44-8804-464e-abf/roughapp/api:latest
          docker push us-central1-docker.pkg.dev/project-c4d8eb44-8804-464e-abf/roughapp/frontend:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 136.119.16.215
          username: blanksearch
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/roughapp
            gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
